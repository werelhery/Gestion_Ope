name: CD - Azure Container Apps Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-to-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Azure Infrastructure (Bicep)
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: deploy/azure/main.bicep
          parameters: deploy/azure/parameters.json

      - name: Build & Push API Image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }} \
            --image gestion-ope-api:${{ github.sha }} \
            --file backend/Dockerfile \
            backend/

      - name: Build & Push Frontend Image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }} \
            --image gestion-ope-frontend:${{ github.sha }} \
            --file frontend/Dockerfile \
            frontend/

      - name: Update Container Apps with New Revision
        run: |
          az containerapp update \
            --name ca-gestion-ope-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/gestion-ope-api:${{ github.sha }}

          az containerapp update \
            --name ca-gestion-ope-frontend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/gestion-ope-frontend:${{ github.sha }}
