name: CI - Gestion_Ope Build & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # 1. Backend CI (.NET 8 Clean Architecture & xUnit Tests)
  # ============================================================================
  backend-ci:
    name: Backend Build & Tests (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/GestionOpe.sln

      - name: Build Solution
        run: dotnet build backend/GestionOpe.sln --no-restore -c Release

      - name: Execute Unit Tests (xUnit)
        run: dotnet test backend/tests/GestionOpe.UnitTests/GestionOpe.UnitTests.csproj -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Execute Integration Tests (xUnit)
        run: dotnet test backend/tests/GestionOpe.IntegrationTests/GestionOpe.IntegrationTests.csproj -c Release --no-build --verbosity normal

  # ============================================================================
  # 2. Frontend CI (Angular 18 Standalone + TailwindCSS)
  # ============================================================================
  frontend-ci:
    name: Frontend Build (Angular 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular Application
        working-directory: frontend
        run: npm run build -- --configuration production

  # ============================================================================
  # 3. Docker Container Build Verification
  # ============================================================================
  docker-build-verification:
    name: Docker Multi-Stage Builds
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: gestion-ope-api:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: gestion-ope-frontend:latest
